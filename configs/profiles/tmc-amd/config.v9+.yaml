executor: slurm
jobs: 100
latency-wait: 60
printshellcmds: true
rerun-incomplete: true
keep-going: true
slurm-no-account: true
slurm-status-command: squeue
default-resources:
  - slurm_partition=amd
  - cpus_per_task=4
  - mem_mb=4000
  - runtime=60
  - disk_mb=2000
set-resources:
  prepare_molecule:
    slurm_partition: amd
    cpus_per_task: 4
    mem_mb: 8000
    runtime: 120
  run_packmol:
