    cpus_per_task: 4
    mem_mb: 8000
    runtime: 60
  gromacs_smoke_npt:
    slurm_partition: amd
    cpus_per_task: 4
    mem_mb: 8000
    runtime: 60
  gromacs_pilot_em:
