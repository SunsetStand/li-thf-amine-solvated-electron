[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solvelec"
version = "0.1.0"
description = "Reproducible workflows for solvated electrons in Li/THF/amine mixtures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SunsetStand"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
workflow = [
  "snakemake>=9.0,<10",
]
slurm = ["snakemake-executor-plugin-slurm>=2.7,<3"]
analysis = [
  "pandas>=2.2",
  "scipy>=1.12",
  "xarray>=2024.1",
  "MDAnalysis>=2.7",
]
dev = ["ruff>=0.9", "mypy>=1.10"]

[project.scripts]
solvelec = "solvelec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_site_packages = true
ignore_missing_imports = true
