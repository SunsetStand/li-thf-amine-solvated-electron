name: Release validation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: bash run.sh test
      - run: python -m solvelec.cli manifest --campaign release --output release-manifest.json configs/campaign.yaml configs/systems.yaml configs/methods.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
