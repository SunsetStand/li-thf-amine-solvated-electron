name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: bash run.sh test
      - run: python -m compileall -q src tests workflow/scripts

  workflow-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[workflow,slurm]"
      - run: bash run.sh dry-run --campaign smoke
      - run: >-
          snakemake --snakefile workflow/Snakefile --directory .
          --config campaign=smoke --profile configs/profiles/tmc-amd --dry-run
